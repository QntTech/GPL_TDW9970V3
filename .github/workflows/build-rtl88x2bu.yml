name: Build RTL88x2BU for TD-W9970 kernel

on:
  workflow_dispatch:
    inputs:
      driver_repo:
        description: 'RTL88x2BU driver git URL'
        required: false
        default: 'https://github.com/RinCat/RTL88x2BU-Linux-Driver.git'
      driver_ref:
        description: 'Branch/tag to checkout'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MIPS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu build-essential bc bison flex libssl-dev libelf-dev
          mips-linux-gnu-gcc --version

      - name: Download and extract GPL archive
        run: |
          set +e
          curl -sL -o GPL_W9970V3.tar.gz "https://static.tp-link.com/resources/gpl/GPL_W9970V3.tar.gz"
          mkdir -p extracted
          tar -xzf GPL_W9970V3.tar.gz -C extracted || tar -xf GPL_W9970V3.tar.gz -C extracted
          rm -f GPL_W9970V3.tar.gz
          KDIR=$(find extracted -maxdepth 5 -type d -path "*kernel/linux-3.4rt" | head -1)
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "Kernel dizini: $KDIR"
          exit 0

      - name: GCC compatibility workaround
        run: |
          set +e
          HIGHEST=$(ls "$KDIR/include/linux/" | grep -oP 'compiler-gcc\K[0-9]+' | sort -n | tail -1)
          GCCVER=$(mips-linux-gnu-gcc -dumpversion | cut -d. -f1)
          echo "En yuksek mevcut: gcc$HIGHEST, kullanilan: gcc$GCCVER"
          if [ ! -f "$KDIR/include/linux/compiler-gcc${GCCVER}.h" ]; then
            cp "$KDIR/include/linux/compiler-gcc${HIGHEST}.h" "$KDIR/include/linux/compiler-gcc${GCCVER}.h"
            echo "compiler-gcc${GCCVER}.h olusturuldu"
          fi
          exit 0

      - name: DIAGNOSTIC - dump kernel's actual CPU arch config (for wpa_supplicant -march matching)
        run: |
          set +e
          echo "=== .config icinde CONFIG_CPU_* ve mimari ile ilgili satirlar ==="
          grep -E "^CONFIG_CPU_|^CONFIG_MIPS|^CONFIG_SYS_HAS_CPU|^CONFIG_CPU_MIPS32" "$KDIR/.config" 2>/dev/null | tee cpu_config_dump.txt
          echo "=== Makefile'da arch/mips altinda -march/-mcpu kullanan satirlar ==="
          grep -rn "\-march=\|\-mcpu=\|cflags-y\|cflags-\$" "$KDIR/arch/mips/Makefile" 2>/dev/null | head -40 | tee -a cpu_config_dump.txt
          echo "=== Ust dizin Makefile'inda genel mimari bayraklari ==="
          grep -n "KBUILD_CFLAGS\s*+=.*march\|KBUILD_CFLAGS\s*+=.*mips" "$KDIR/Makefile" "$KDIR/arch/mips/Makefile" 2>/dev/null | tee -a cpu_config_dump.txt
          cat cpu_config_dump.txt

      - name: Clone RTL88x2BU driver source
        run: |
          set -o pipefail
          REF="${{ github.event.inputs.driver_ref }}"
          REPO="${{ github.event.inputs.driver_repo }}"
          echo "Deneniyor: $REPO @ $REF" > clone_log.txt
          if git clone --depth 1 -b "$REF" "$REPO" rtl88x2bu >> clone_log.txt 2>&1; then
            echo "BASARILI: $REF branch/tag ile klonlandi" >> clone_log.txt
          else
            echo "UYARI: $REF bulunamadi/basarisiz, default branch deneniyor" >> clone_log.txt
            rm -rf rtl88x2bu
            git clone --depth 1 "$REPO" rtl88x2bu >> clone_log.txt 2>&1
          fi
          cat clone_log.txt
          ls rtl88x2bu/ 2>&1 | head -30 || echo "KLASOR OLUSMADI"

      - name: DIAGNOSTIC PATCH - trace wiphy_register return value (RTW_INFO isn't visible in our logs, RTW_ERR is)
        run: |
          set +e
          FILE="rtl88x2bu/os_dep/linux/ioctl_cfg80211.c"
          if [ ! -f "$FILE" ]; then
            echo "UYARI: dosya bulunamadi, patch atlaniyor"
            exit 0
          fi
          echo "--- Patch oncesi ---"
          grep -n -A15 "^int rtw_cfg80211_dev_res_register" "$FILE"
          # base64 ile enjekte edilecek satiri kodluyoruz, boylece YAML
          # block-scalar icinde hic tirnak/escape catismasi olmuyor.
          echo 'CVJUV19FUlIoIlFOVERJQUcgd2lwaHlfcmVnaXN0ZXIgY2FsbCByZWFjaGVkXG4iKTsK' | base64 -d > /tmp/qntdiag_line.txt
          cat -A /tmp/qntdiag_line.txt
          MARKER_LINE=$(grep -n "if (rtw_wiphy_register(dvobj_to_wiphy(dvobj)) != 0)" "$FILE" | head -1 | cut -d: -f1)
          echo "Marker satiri: $MARKER_LINE"
          if [ -n "$MARKER_LINE" ]; then
            sed -i "${MARKER_LINE}r /tmp/qntdiag_line.txt" "$FILE"
            echo "BASARILI: satir eklendi"
          else
            echo "UYARI: marker bulunamadi, patch atlaniyor"
          fi
          echo "--- Patch sonrasi ---"
          grep -n -A16 "^int rtw_cfg80211_dev_res_register" "$FILE"

      - name: Shrink build - disable debug logging and unneeded features (modem has ~58MB RAM total)
        run: |
          if [ ! -d rtl88x2bu ]; then
            echo "rtl88x2bu klasoru yok, adim atlaniyor"
            exit 0
          fi
          cd rtl88x2bu
          echo "--- Kucultme oncesi ilgili CONFIG satirlari ---"
          grep -n "^CONFIG_RTW_DEBUG\|^CONFIG_PROC_DEBUG\|^CONFIG_MP_INCLUDED\|^CONFIG_WIFI_MONITOR\|^CONFIG_P2P\|^CONFIG_BT_COEXIST\|^CONFIG_80211W" Makefile
          # RTW_DEBUG ve PROC_DEBUG en buyuk .text/.rodata sisiricileri (log string'leri + debug kod yollari)
          sed -i 's/^CONFIG_RTW_DEBUG = y/CONFIG_RTW_DEBUG = y/' Makefile
          sed -i 's/^CONFIG_PROC_DEBUG = y/CONFIG_PROC_DEBUG = n/' Makefile
          # Bizim senaryoda (basit STA client + AP) gerekmeyen ozellikler
          sed -i 's/^CONFIG_MP_INCLUDED = y/CONFIG_MP_INCLUDED = n/' Makefile
          sed -i 's/^CONFIG_WIFI_MONITOR = y/CONFIG_WIFI_MONITOR = n/' Makefile
          sed -i 's/^CONFIG_P2P = y/CONFIG_P2P = n/' Makefile
          sed -i 's/^CONFIG_BT_COEXIST = y/CONFIG_BT_COEXIST = n/' Makefile
          sed -i 's/^CONFIG_80211W = y/CONFIG_80211W = n/' Makefile
          echo "--- Kucultme sonrasi ilgili CONFIG satirlari ---"
          grep -n "^CONFIG_RTW_DEBUG\|^CONFIG_PROC_DEBUG\|^CONFIG_MP_INCLUDED\|^CONFIG_WIFI_MONITOR\|^CONFIG_P2P\|^CONFIG_BT_COEXIST\|^CONFIG_80211W" Makefile

      - name: Configure driver Makefile for MIPS platform
        run: |
          if [ ! -d rtl88x2bu ]; then
            echo "rtl88x2bu klasoru yok, adim atlaniyor"
            exit 0
          fi
          cd rtl88x2bu
          echo "--- Cip secimi dogrulama (CONFIG_RTL8822B) ---"
          grep -n "^CONFIG_RTL8822B" Makefile
          echo ""
          echo "--- Orijinal platform ayarlari ---"
          grep -n "CONFIG_PLATFORM" Makefile | head -60 > ../platform_options.txt
          cat ../platform_options.txt
          # I386 platformunu kapat, MIPS icin manuel flag enjekte edecegiz
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile || true
          echo "--- Duzenleme sonrasi platform durumu ---"
          grep -n "CONFIG_PLATFORM" Makefile | head -60
          echo ""
          echo "--- Big-endian MIPS icin manuel ccflags-y enjekte ediliyor ---"
          FIRST_CCFLAGS_LINE=$(grep -n "^ccflags-y" Makefile | head -1 | cut -d: -f1)
          echo "Ilk ccflags-y satiri: $FIRST_CCFLAGS_LINE"
          sed -i "${FIRST_CCFLAGS_LINE}i ccflags-y += -DCONFIG_BIG_ENDIAN" Makefile
          echo "--- Enjeksiyon sonrasi ilk 10 ccflags-y satiri ---"
          grep -n "ccflags-y" Makefile | head -10
          echo ""
          echo "--- extern-inline coklu tanim linker sorunu icin ldflags-y enjekte ediliyor ---"
          FIRST_LDFLAGS_LINE=$(grep -n "^ldflags-y" Makefile | head -1 | cut -d: -f1)
          echo "Ilk ldflags-y satiri: $FIRST_LDFLAGS_LINE"
          if [ -n "$FIRST_LDFLAGS_LINE" ]; then
            sed -i "${FIRST_LDFLAGS_LINE}i ldflags-y += --allow-multiple-definition" Makefile
          else
            echo "ldflags-y += --allow-multiple-definition" >> Makefile
          fi
          echo "--- Enjeksiyon sonrasi ldflags-y satirlari ---"
          grep -n "ldflags-y" Makefile

      - name: Inject missing radiotap AMPDU_EOF constants
        run: |
          if [ ! -d rtl88x2bu ]; then
            echo "rtl88x2bu klasoru yok, adim atlaniyor"
            exit 0
          fi
          cd rtl88x2bu
          RADIOTAP_FILE="core/monitor/rtw_radiotap.c"
          if [ ! -f "$RADIOTAP_FILE" ]; then
            echo "UYARI: $RADIOTAP_FILE bulunamadi, atlandi"
            exit 0
          fi
          # Bu kernel (3.4.11) surumu, dosyadaki
          # "LINUX_VERSION_CODE < KERNEL_VERSION(3,7,0)" dalina dusuyor,
          # o dal IEEE80211_RADIOTAP_AMPDU_EOF / EOF_KNOWN tanimlamiyor
          # (sadece 3.7-4.17 araligi tanimliyor). Dosyanin en basina
          # kosulsuz fallback ekliyoruz.
          printf '%s\n' '#ifndef IEEE80211_RADIOTAP_AMPDU_EOF' '#define IEEE80211_RADIOTAP_AMPDU_EOF 0x0040' '#endif' '#ifndef IEEE80211_RADIOTAP_AMPDU_EOF_KNOWN' '#define IEEE80211_RADIOTAP_AMPDU_EOF_KNOWN 0x0080' '#endif' > /tmp/ampdu_eof_fallback.h
          cat /tmp/ampdu_eof_fallback.h "$RADIOTAP_FILE" > /tmp/rtw_radiotap_new.c
          mv /tmp/rtw_radiotap_new.c "$RADIOTAP_FILE"
          echo "--- Enjeksiyon sonrasi ilk 15 satir ---"
          head -15 "$RADIOTAP_FILE"

      - name: Scan for VHT/cfg80211_chan_def/radiotap dependent code (informational)
        run: |
          if [ ! -d rtl88x2bu ]; then
            exit 0
          fi
          cd rtl88x2bu
          echo "--- ieee80211_sta_vht_cap / cfg80211_chan_def referanslari ---"
          grep -rln "ieee80211_sta_vht_cap\|cfg80211_chan_def" --include="*.c" . || echo "yok"
          echo ""
          echo "--- IEEE80211_RADIOTAP_VHT / AMPDU_STATUS referanslari ---"
          grep -rln "IEEE80211_RADIOTAP_VHT\|IEEE80211_RADIOTAP_AMPDU_STATUS" --include="*.c" . || echo "yok"
          echo ""
          echo "--- IEEE80211_CHAN_NO_80MHZ / 160MHZ referanslari ---"
          grep -rln "IEEE80211_CHAN_NO_80MHZ\|IEEE80211_CHAN_NO_160MHZ" --include="*.c" . || echo "yok"
          echo ""
          echo "--- BB_GAIN_5G referanslari ---"
          grep -rln "BB_GAIN_5G" --include="*.c" . || echo "yok"
          echo ""
          echo "--- extern __inline fonksiyonlar (multiple definition riski) ---"
          grep -rn "extern __inline\|extern inline" --include="*.h" . | head -10 || echo "yok"

      - name: Add wireless_send_event stub (kernel struct net lacks wext_nlevents)
        run: |
          if [ ! -d rtl88x2bu ]; then
            echo "rtl88x2bu klasoru yok, adim atlaniyor"
            exit 0
          fi
          cd rtl88x2bu
          # Bu kernel CONFIG_WEXT_CORE ile derlenmemis (struct net'te
          # wext_nlevents alani yok), o yuzden gercek net/wireless/wext-core.o'yu
          # kullanamayiz (ABI uyumsuzlugu / struct net farkli boyutta olur).
          # wireless_send_event sadece userspace'e bilgilendirme event'i
          # gonderir (iwconfig/wpa_supplicant icin) - fonksiyonel olarak
          # kritik degil, no-op stub olarak saglıyoruz.
          cat > wireless_send_event_stub.c << 'STUB_EOF'
          #include <linux/module.h>
          #include <linux/netdevice.h>
          #include <net/iw_handler.h>

          void wireless_send_event(struct net_device *dev,
                                    unsigned int cmd,
                                    union iwreq_data *wrqu,
                                    const char *extra)
          {
              /* Bu kernel CONFIG_WEXT_CORE ile derlenmedigi icin gercek
                 wireless extensions event altyapisi yok. No-op stub. */
          }
          EXPORT_SYMBOL(wireless_send_event);
          STUB_EOF
          echo "--- wireless_send_event_stub.c olusturuldu ---"
          cat wireless_send_event_stub.c
          echo ""
          echo "--- Makefile'a stub dosyasini ekliyoruz ---"
          MODULE_LINE=$(grep -n "^\$(MODULE_NAME)-y +=" Makefile | head -1)
          echo "Bulunan satir: $MODULE_LINE"
          if [ -n "$MODULE_LINE" ]; then
            LINE_NUM=$(echo "$MODULE_LINE" | cut -d: -f1)
            sed -i "${LINE_NUM}a \$(MODULE_NAME)-y += wireless_send_event_stub.o" Makefile
          else
            echo "UYARI: MODULE_NAME-y satiri bulunamadi, farkli desen deneniyor"
            grep -n "MODULE_NAME)-y" Makefile | head -5
          fi
          echo "--- Sonuc ---"
          grep -n "wireless_send_event_stub" Makefile

      - name: Attempt kernel module build
        run: |
          set +e
          if [ ! -d rtl88x2bu ]; then
            echo "rtl88x2bu klasoru yok, build atlaniyor" | tee build_log.txt
            exit 0
          fi
          cd rtl88x2bu
          echo "=== Derleme baslatiliyor ==="
          make ARCH=mips CROSS_COMPILE=mips-linux-gnu- KSRC="$GITHUB_WORKSPACE/$KDIR" V=1 2>&1 | tee ../build_log.txt
          echo "=== Derleme sonucu ==="
          find . -name "*.ko" 2>/dev/null | tee ../ko_files.txt
          echo "=== DIAGNOSTIC: kernel'in gercekten kullandigi -march/-mcpu/-mips bayraklari ==="
          grep -oE "\-march=[a-zA-Z0-9]+|\-mcpu=[a-zA-Z0-9]+|-mips[0-9]+r?[0-9]*" ../build_log.txt | sort -u | tee ../kernel_arch_flags.txt
          if [ -s ../ko_files.txt ]; then
            echo "BASARILI: .ko dosyasi olustu"
          else
            echo "BASARISIZ: .ko dosyasi olusmadi, build_log.txt'e bak"
          fi
          exit 0

      - name: Strip debug info from built module (modem has very limited RAM)
        run: |
          if [ ! -d rtl88x2bu ]; then
            echo "rtl88x2bu klasoru yok, strip atlaniyor"
            exit 0
          fi
          cd rtl88x2bu
          for ko in $(find . -name "*.ko"); do
            echo "--- Strip oncesi boyut: $ko ---"
            ls -la "$ko"
            mips-linux-gnu-strip --strip-debug "$ko"
            echo "--- Strip sonrasi boyut: $ko ---"
            ls -la "$ko"
          done

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp build_log.txt output/ 2>/dev/null || true
          cp clone_log.txt output/ 2>/dev/null || true
          cp platform_options.txt output/ 2>/dev/null || true
          cp cpu_config_dump.txt output/ 2>/dev/null || true
          cp kernel_arch_flags.txt output/ 2>/dev/null || true
          find rtl88x2bu -name "*.ko" -exec cp {} output/ \; 2>/dev/null || true
          tail -300 build_log.txt > output/build_log_tail300.txt 2>/dev/null || true
          ls -la output/

      - name: Cleanup large source before commit
        run: rm -rf extracted rtl88x2bu GPL_W9970V3.tar.gz

      - name: Push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          rm -rf rtl88x2bu_build_output
          mv output rtl88x2bu_build_output
          git add rtl88x2bu_build_output/
          git commit -m "RTL88x2BU derleme denemesi" || echo "Degisiklik yok"
          git push
