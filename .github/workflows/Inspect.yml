name: Inspect cfg80211 build structure

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract GPL archive
        run: |
          curl -sL -o GPL_W9970V3.tar.gz "https://static.tp-link.com/resources/gpl/GPL_W9970V3.tar.gz"
          mkdir -p extracted
          tar -xzf GPL_W9970V3.tar.gz -C extracted || tar -xf GPL_W9970V3.tar.gz -C extracted
          rm -f GPL_W9970V3.tar.gz
          KDIR=$(find extracted -maxdepth 5 -type d -path "*kernel/linux-3.4rt" | head -1)
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "Kernel dizini: $KDIR"

      - name: Inspect net/wireless Makefile and Kconfig
        run: |
          set +e
          {
            echo "=== KDIR: $KDIR ==="
            echo "=== net/wireless dizini var mi ==="
            ls -la "$KDIR/net/wireless/" 2>&1
            echo ""
            echo "=== net/wireless/Makefile ==="
            cat "$KDIR/net/wireless/Makefile" 2>&1
            echo ""
            echo "=== net/wireless/Kconfig (ilk 60 satir) ==="
            head -60 "$KDIR/net/wireless/Kconfig" 2>&1
            echo ""
            echo "=== net/Makefile icinde wireless referansi ==="
            grep -n "wireless" "$KDIR/net/Makefile" 2>&1
            echo ""
            echo "=== .config dosyalari araniyor ==="
            find extracted -iname ".config" 2>&1
            echo ""
            echo "=== auto.conf araniyor ==="
            find "$KDIR" -maxdepth 3 -iname "auto.conf" 2>&1
            echo ""
            echo "=== net/wireless altindaki .o/.ko dosyalari ==="
            find "$KDIR/net/wireless" \( -iname "*.o" -o -iname "*.ko" \) 2>&1
          } > cfg80211_report.txt
          echo "Rapor olusturuldu, boyut:"
          wc -l cfg80211_report.txt
          cat cfg80211_report.txt
          exit 0

      - name: Cleanup
        run: rm -rf extracted

      - name: Push report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cfg80211_report.txt
          git commit -m "cfg80211 build yapisi raporu" || echo "Degisiklik yok"
          git push
