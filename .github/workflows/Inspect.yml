name: Inspect cfg80211 build structure

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract GPL archive
        run: |
          curl -sL -o GPL_W9970V3.tar.gz "https://static.tp-link.com/resources/gpl/GPL_W9970V3.tar.gz"
          mkdir -p extracted
          tar -xzf GPL_W9970V3.tar.gz -C extracted || tar -xf GPL_W9970V3.tar.gz -C extracted
          rm -f GPL_W9970V3.tar.gz
          KDIR=$(find extracted -maxdepth 5 -type d -path "*kernel/linux-3.4rt" | head -1)
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "Kernel dizini: $KDIR"

      - name: Inspect net/wireless Makefile and Kconfig
        run: |
          {
            echo "=== net/wireless/Makefile ==="
            cat "$KDIR/net/wireless/Makefile"
            echo ""
            echo "=== net/wireless/Kconfig (ilk 60 satir) ==="
            head -60 "$KDIR/net/wireless/Kconfig"
            echo ""
            echo "=== net/Makefile icinde wireless referansi ==="
            grep -n "wireless" "$KDIR/net/Makefile"
            echo ""
            echo "=== mevcut .config dosyasinda CFG80211 ile ilgili satirlar (varsa) ==="
            find extracted -iname ".config" -exec grep -l "CFG80211" {} \; 2>/dev/null
            find extracted -iname ".config" | head -3 | while read f; do
              echo "--- $f ---"
              grep "CFG80211\|WIRELESS_EXT\|WEXT" "$f" 2>/dev/null
            done
            echo ""
            echo "=== Ana kernel .config (build sirasinda kullanilan, varsa auto.conf) ==="
            find "$KDIR" -maxdepth 2 -iname ".config" -o -maxdepth 2 -iname "auto.conf"
            echo ""
            echo "=== net/wireless altindaki .o veya .ko dosyalari (onceden derlenmis mi) ==="
            find "$KDIR/net/wireless" -iname "*.o" -o -iname "*.ko" 2>/dev/null | head -20
          } > cfg80211_report.txt
          cat cfg80211_report.txt

      - name: Cleanup
        run: rm -rf extracted

      - name: Push report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cfg80211_report.txt
          git commit -m "cfg80211 build yapisi raporu" || echo "Degisiklik yok"
          git push
