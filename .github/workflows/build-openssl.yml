name: Build OpenSSL for TD-W9970 (mips uclibc target)

on:
  workflow_dispatch:
    inputs:
      openssl_ref:
        description: 'OpenSSL git tag'
        required: false
        default: 'OpenSSL_1_0_2u'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MIPS musl toolchain (big-endian, soft-float - matches this modem)
        run: |
          set +e
          curl -sL -o mips-toolchain.tar.xz "https://github.com/cross-tools/musl-cross/releases/download/20260515/mips-unknown-linux-muslsf.tar.xz"
          ls -la mips-toolchain.tar.xz
          mkdir -p mips-toolchain
          tar -xJf mips-toolchain.tar.xz -C mips-toolchain
          GCC_BIN=$(find mips-toolchain -maxdepth 4 -name "*-gcc" -type f | head -1)
          TOOLCHAIN_BIN_DIR="$PWD/$(dirname "$GCC_BIN")"
          GCC_PREFIX=$(basename "$GCC_BIN" | sed 's/-gcc$//')
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN_DIR" >> "$GITHUB_ENV"
          echo "GCC_PREFIX=$GCC_PREFIX" >> "$GITHUB_ENV"
          export PATH="$TOOLCHAIN_BIN_DIR:$PATH"
          "$TOOLCHAIN_BIN_DIR/$GCC_PREFIX-gcc" --version

      - name: Clone OpenSSL source
        run: |
          set +e
          REF="${{ github.event.inputs.openssl_ref }}"
          git clone --depth 1 -b "$REF" https://github.com/openssl/openssl.git openssl_src 2>&1 | tee clone_log.txt
          ls openssl_src/ | head -20

      - name: Configure and build OpenSSL
        run: |
          set +e
          export PATH="$TOOLCHAIN_BIN:$PATH"
          cd openssl_src
          mkdir -p /tmp/openssl_install
          ./Configure linux-mips32 \
            --prefix=/tmp/openssl_install \
            --cross-compile-prefix="$GCC_PREFIX-" \
            no-asm no-shared no-tests \
            2>&1 | tee ../openssl_configure_log.txt
          echo "=== make baslatiliyor ==="
          make -j$(nproc) 2>&1 | tee ../openssl_build_log.txt
          echo "=== make install ==="
          make install_sw 2>&1 | tee ../openssl_install_log.txt
          echo "=== Sonuc ==="
          find /tmp/openssl_install -name "*.a" -o -name "*.so*" | tee ../openssl_output_files.txt

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp openssl_configure_log.txt output/ 2>/dev/null || true
          tail -300 openssl_build_log.txt > output/openssl_build_log_tail300.txt 2>/dev/null || true
          cp openssl_install_log.txt output/ 2>/dev/null || true
          cp openssl_output_files.txt output/ 2>/dev/null || true
          ls -la output/

      - name: Package install directory
        run: |
          if [ -d /tmp/openssl_install ]; then
            tar -czf output/openssl_install.tar.gz -C /tmp openssl_install
            ls -la output/openssl_install.tar.gz
          else
            echo "openssl_install dizini yok, paketlenemedi"
          fi

      - name: Cleanup large source before commit
        run: rm -rf openssl_src

      - name: Push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          rm -rf openssl_build_output
          mv output openssl_build_output
          git add openssl_build_output/
          git commit -m "OpenSSL MIPS derleme denemesi" || echo "Degisiklik yok"
          git push
