name: Build libnl for TD-W9970 (mips uclibc target)

on:
  workflow_dispatch:
    inputs:
      libnl_ref:
        description: 'libnl git tag'
        required: false
        default: 'libnl3_4_0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools (build-essential still needed for autoreconf etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool bison flex pkg-config curl

      - name: Install MIPS musl toolchain (big-endian, soft-float - matches this modem)
        run: |
          set +e
          curl -sL -o mips-toolchain.tar.xz "https://github.com/cross-tools/musl-cross/releases/download/20260515/mips-unknown-linux-muslsf.tar.xz"
          ls -la mips-toolchain.tar.xz
          mkdir -p mips-toolchain
          tar -xJf mips-toolchain.tar.xz -C mips-toolchain
          GCC_BIN=$(find mips-toolchain -maxdepth 4 -name "*-gcc" -type f | head -1)
          TOOLCHAIN_BIN_DIR="$PWD/$(dirname "$GCC_BIN")"
          GCC_PREFIX=$(basename "$GCC_BIN" | sed 's/-gcc$//')
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN_DIR" >> "$GITHUB_ENV"
          echo "GCC_PREFIX=$GCC_PREFIX" >> "$GITHUB_ENV"
          export PATH="$TOOLCHAIN_BIN_DIR:$PATH"
          "$TOOLCHAIN_BIN_DIR/$GCC_PREFIX-gcc" --version

      - name: Clone libnl source
        run: |
          set +e
          REF="${{ github.event.inputs.libnl_ref }}"
          git clone --depth 1 -b "$REF" https://github.com/thom311/libnl.git libnl_src 2>&1 | tee clone_log.txt
          ls libnl_src/ | head -20

      - name: Generate configure script
        run: |
          set +e
          cd libnl_src
          autoreconf -fi 2>&1 | tee ../autoreconf_log.txt
          ls configure 2>&1

      - name: Patch musl in6_addr redefinition conflict (known upstream fix)
        run: |
          set +e
          # libnl bundles its own copy of kernel headers under
          # include/linux-private/linux/. if_bridge.h includes
          # <linux/in6.h> which redefines struct in6_addr,
          # sockaddr_in6, and ipv6_mreq - these are already fully
          # defined by musl's own <netinet/in.h>, causing a hard
          # redefinition error (glibc silently tolerates this
          # duplication via header guards, musl does not). This is
          # the same fix used upstream by OpenEmbedded, Buildroot,
          # and Alpine for libnl+musl builds: drop the redundant
          # kernel header include, musl's own header already
          # provides everything if_bridge.h needs.
          FILE="libnl_src/include/linux-private/linux/if_bridge.h"
          if [ -f "$FILE" ]; then
            grep -n "include.*linux/in6.h" "$FILE"
            sed -i '/#include <linux\/in6\.h>/d' "$FILE"
            echo "--- Patch sonrasi ---"
            grep -n "in6" "$FILE" || echo "in6.h include kaldirildi"
          else
            echo "UYARI: $FILE bulunamadi"
          fi
          FILE2="libnl_src/include/linux-private/linux/ipv6.h"
          if [ -f "$FILE2" ]; then
            grep -n "include.*linux/in6.h" "$FILE2"
            sed -i '/#include <linux\/in6\.h>/d' "$FILE2"
          fi

      - name: Configure and build libnl
        run: |
          set +e
          export PATH="$TOOLCHAIN_BIN:$PATH"
          cd libnl_src
          mkdir -p /tmp/libnl_install
          ./configure \
            --host="$GCC_PREFIX" \
            --prefix=/tmp/libnl_install \
            --disable-shared \
            --enable-static \
            --disable-cli \
            CC="$GCC_PREFIX-gcc" \
            2>&1 | tee ../libnl_configure_log.txt
          echo "=== make baslatiliyor ==="
          make -j$(nproc) 2>&1 | tee ../libnl_build_log.txt
          echo "=== make install ==="
          make install 2>&1 | tee ../libnl_install_log.txt
          echo "=== Sonuc ==="
          find /tmp/libnl_install -name "*.a" -o -name "*.so*" | tee ../libnl_output_files.txt

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp clone_log.txt output/ 2>/dev/null || true
          cp autoreconf_log.txt output/ 2>/dev/null || true
          cp libnl_configure_log.txt output/ 2>/dev/null || true
          tail -300 libnl_build_log.txt > output/libnl_build_log_tail300.txt 2>/dev/null || true
          cp libnl_install_log.txt output/ 2>/dev/null || true
          cp libnl_output_files.txt output/ 2>/dev/null || true
          ls -la output/

      - name: Package install directory
        run: |
          if [ -d /tmp/libnl_install ]; then
            tar -czf output/libnl_install.tar.gz -C /tmp libnl_install
            ls -la output/libnl_install.tar.gz
          else
            echo "libnl_install dizini yok, paketlenemedi"
          fi

      - name: Cleanup large source before commit
        run: rm -rf libnl_src

      - name: Push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          rm -rf libnl_build_output
          mv output libnl_build_output
          git add libnl_build_output/
          git commit -m "libnl MIPS derleme denemesi" || echo "Degisiklik yok"
          git push
