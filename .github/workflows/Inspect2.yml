name: Inspect stock vmlinux for cfg80211

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract GPL archive
        run: |
          set +e
          curl -sL -o GPL_W9970V3.tar.gz "https://static.tp-link.com/resources/gpl/GPL_W9970V3.tar.gz"
          mkdir -p extracted
          tar -xzf GPL_W9970V3.tar.gz -C extracted || tar -xf GPL_W9970V3.tar.gz -C extracted
          rm -f GPL_W9970V3.tar.gz
          KDIR=$(find extracted -maxdepth 5 -type d -path "*kernel/linux-3.4rt" | head -1)
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          exit 0

      - name: Check stock vmlinux.map for cfg80211
        run: |
          set +e
          echo "=== vmlinux.map boyutu ===" > vmlinux_report.txt
          ls -la "$KDIR/vmlinux.map" >> vmlinux_report.txt 2>&1
          echo "" >> vmlinux_report.txt

          echo "=== vmlinux.map icinde wiphy_new/cfg80211 var mi (STOCK, TP-Link'in kendi resmi build'i) ===" >> vmlinux_report.txt
          grep -i "wiphy_new\|cfg80211_scan_done\|wiphy_register" "$KDIR/vmlinux.map" >> vmlinux_report.txt 2>&1
          echo "grep exit: $?" >> vmlinux_report.txt
          echo "" >> vmlinux_report.txt

          echo "=== vmlinux.map icinde herhangi bir cfg80211 gecen satir var mi (daha genis arama) ===" >> vmlinux_report.txt
          grep -ic "cfg80211" "$KDIR/vmlinux.map" >> vmlinux_report.txt 2>&1
          echo "" >> vmlinux_report.txt

          echo "=== vmlinux.map icinde wl0/brcm ile ilgili semboller (dahili wifi surucusunun gercekten neyi kullandigini gormek icin) ===" >> vmlinux_report.txt
          grep -ic "wl_iw\|wlc_" "$KDIR/vmlinux.map" >> vmlinux_report.txt 2>&1
          echo "" >> vmlinux_report.txt

          echo "=== vmlinux.map icinde wext (wireless extensions, cfg80211'in eski alternatifi) var mi ===" >> vmlinux_report.txt
          grep -ic "wext_" "$KDIR/vmlinux.map" >> vmlinux_report.txt 2>&1

          cat vmlinux_report.txt
          exit 0

      - name: Cleanup
        run: rm -rf extracted
        continue-on-error: true

      - name: Push report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add vmlinux_report.txt
          git commit -m "stock vmlinux cfg80211 kontrolu" || echo "Degisiklik yok"
          git push
