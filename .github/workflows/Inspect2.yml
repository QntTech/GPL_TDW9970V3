name: Inspect built-in cfg80211 symbols

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nm tool
        run: sudo apt-get install -y binutils-mips-linux-gnu || sudo apt-get install -y binutils

      - name: Download and extract GPL archive
        run: |
          set +e
          curl -sL -o GPL_W9970V3.tar.gz "https://static.tp-link.com/resources/gpl/GPL_W9970V3.tar.gz"
          mkdir -p extracted
          tar -xzf GPL_W9970V3.tar.gz -C extracted || tar -xf GPL_W9970V3.tar.gz -C extracted
          rm -f GPL_W9970V3.tar.gz
          KDIR=$(find extracted -maxdepth 5 -type d -path "*kernel/linux-3.4rt" | head -1)
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          exit 0

      - name: Check symbols in built-in.o and vmlinux
        run: |
          set +e
          echo "=== hangi nm mevcut ===" > symbol_report.txt
          which mips-linux-gnu-nm nm >> symbol_report.txt 2>&1
          echo "" >> symbol_report.txt

          echo "=== net/built-in.o boyutu ===" >> symbol_report.txt
          ls -la "$KDIR/net/built-in.o" >> symbol_report.txt 2>&1
          echo "" >> symbol_report.txt

          echo "=== net/built-in.o icinde wiphy_new / cfg80211_scan_done araniyor (mips-linux-gnu-nm) ===" >> symbol_report.txt
          mips-linux-gnu-nm "$KDIR/net/built-in.o" 2>&1 | grep -i "wiphy_new\|cfg80211_scan_done\|wiphy_register" >> symbol_report.txt 2>&1
          echo "grep exit: $?" >> symbol_report.txt
          echo "" >> symbol_report.txt

          echo "=== net/wireless altinda herhangi bir .o dosyasi derlenmis mi (core.o vs) ===" >> symbol_report.txt
          find "$KDIR/net/wireless" -iname "*.o" >> symbol_report.txt 2>&1
          echo "" >> symbol_report.txt

          echo "=== TUM built-in.o dosyalari icinde wiphy_new arama (genis tarama) ===" >> symbol_report.txt
          find "$KDIR" -iname "built-in.o" 2>/dev/null | while read f; do
            RESULT=$(mips-linux-gnu-nm "$f" 2>/dev/null | grep -i "wiphy_new")
            if [ -n "$RESULT" ]; then
              echo "BULUNDU: $f -> $RESULT" >> symbol_report.txt
            fi
          done
          echo "Tarama tamamlandi" >> symbol_report.txt
          echo "" >> symbol_report.txt

          echo "=== vmlinux var mi, sembolleri iceriyor mu ===" >> symbol_report.txt
          find "$KDIR" -maxdepth 1 -iname "vmlinux*" >> symbol_report.txt 2>&1

          cat symbol_report.txt
          exit 0

      - name: Cleanup
        run: rm -rf extracted
        continue-on-error: true

      - name: Push report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add symbol_report.txt
          git commit -m "cfg80211 sembol arama raporu" || echo "Degisiklik yok"
          git push
