name: Build RTL8812AU for TD-W9970 kernel

on:
  workflow_dispatch:
    inputs:
      driver_repo:
        description: 'RTL8812AU driver git URL'
        required: false
        default: 'https://github.com/aircrack-ng/rtl8812au.git'
      driver_ref:
        description: 'Branch/tag to checkout'
        required: false
        default: 'v4.3.21'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MIPS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu build-essential bc bison flex libssl-dev libelf-dev
          mips-linux-gnu-gcc --version

      - name: Download and extract GPL archive
        run: |
          curl -sL -o GPL_W9970V3.tar.gz "https://static.tp-link.com/resources/gpl/GPL_W9970V3.tar.gz"
          mkdir -p extracted
          tar -xzf GPL_W9970V3.tar.gz -C extracted || tar -xf GPL_W9970V3.tar.gz -C extracted
          rm -f GPL_W9970V3.tar.gz
          KDIR=$(find extracted -maxdepth 5 -type d -path "*kernel/linux-3.4rt" | head -1)
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "Kernel dizini: $KDIR"

      - name: GCC compatibility workaround
        run: |
          set +e
          echo "--- Mevcut compiler-gcc*.h dosyalari ---"
          ls "$KDIR/include/linux/" | grep compiler-gcc
          HIGHEST=$(ls "$KDIR/include/linux/" | grep -oP 'compiler-gcc\K[0-9]+' | sort -n | tail -1)
          GCCVER=$(mips-linux-gnu-gcc -dumpversion | cut -d. -f1)
          echo "En yuksek mevcut: gcc$HIGHEST, kullanilan: gcc$GCCVER"
          if [ ! -f "$KDIR/include/linux/compiler-gcc${GCCVER}.h" ]; then
            cp "$KDIR/include/linux/compiler-gcc${HIGHEST}.h" "$KDIR/include/linux/compiler-gcc${GCCVER}.h"
            echo "compiler-gcc${GCCVER}.h olusturuldu"
          fi

      - name: Clone RTL8812AU driver source
        run: |
          set -o pipefail
          REF="${{ github.event.inputs.driver_ref }}"
          REPO="${{ github.event.inputs.driver_repo }}"
          echo "Deneniyor: $REPO @ $REF" > clone_log.txt
          if git clone --depth 1 -b "$REF" "$REPO" rtl8812au >> clone_log.txt 2>&1; then
            echo "BASARILI: $REF branch/tag ile klonlandi" >> clone_log.txt
          else
            echo "UYARI: $REF bulunamadi/basarisiz, default branch deneniyor" >> clone_log.txt
            rm -rf rtl8812au
            git clone --depth 1 "$REPO" rtl8812au >> clone_log.txt 2>&1
          fi
          echo "--- clone_log.txt ---"
          cat clone_log.txt
          echo "--- rtl8812au icerigi ---"
          ls rtl8812au/ 2>&1 | head -30 || echo "KLASOR OLUSMADI - clone tamamen basarisiz"

      - name: Configure driver Makefile for MIPS platform
        run: |
          if [ ! -d rtl8812au ]; then
            echo "rtl8812au klasoru yok, clone basarisiz olmus - adim atlaniyor"
            exit 0
          fi
          cd rtl8812au
          echo "--- Orijinal platform ayarlari (ilk 60 satir grep) ---"
          grep -n "CONFIG_PLATFORM" Makefile | head -60 > ../platform_options.txt
          cat ../platform_options.txt
          # I386 platformunu kapat (biz MIPS icin manuel flag enjekte edecegiz)
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile || true
          echo "--- Duzenleme sonrasi platform durumu ---"
          grep -n "CONFIG_PLATFORM" Makefile | head -60
          echo ""
          echo "--- Big-endian MIPS icin manuel EXTRA_CFLAGS enjekte ediliyor ---"
          FIRST_EXTRA_CFLAGS_LINE=$(grep -n "^EXTRA_CFLAGS" Makefile | head -1 | cut -d: -f1)
          echo "Ilk EXTRA_CFLAGS satiri: $FIRST_EXTRA_CFLAGS_LINE"
          sed -i "${FIRST_EXTRA_CFLAGS_LINE}i EXTRA_CFLAGS += -DCONFIG_BIG_ENDIAN" Makefile
          echo "--- Enjeksiyon sonrasi ilk 10 EXTRA_CFLAGS satiri ---"
          grep -n "EXTRA_CFLAGS" Makefile | head -10
          echo ""
          echo "--- Eski kernelde eksik radiotap sabitlerini global header'a enjekte ediyoruz ---"
          HEADER_GUARD_LINE=$(grep -n "^#define __BASIC_TYPES_H__" include/basic_types.h | head -1 | cut -d: -f1)
          echo "Header guard satiri: $HEADER_GUARD_LINE"
          if [ -n "$HEADER_GUARD_LINE" ]; then
            printf '%s\n' \
              '#ifndef IEEE80211_RADIOTAP_VHT' \
              '#define IEEE80211_RADIOTAP_VHT 21' \
              '#endif' \
              '#ifndef IEEE80211_CHAN_NO_80MHZ' \
              '#define IEEE80211_CHAN_NO_80MHZ (1<<7)' \
              '#endif' \
              '#ifndef IEEE80211_CHAN_NO_160MHZ' \
              '#define IEEE80211_CHAN_NO_160MHZ (1<<8)' \
              '#endif' > /tmp/radiotap_fallback.h
            head -n "$HEADER_GUARD_LINE" include/basic_types.h > /tmp/basic_types_new.h
            cat /tmp/radiotap_fallback.h >> /tmp/basic_types_new.h
            tail -n +$((HEADER_GUARD_LINE + 1)) include/basic_types.h >> /tmp/basic_types_new.h
            mv /tmp/basic_types_new.h include/basic_types.h
            echo "--- Enjeksiyon sonrasi basic_types.h ilk 35 satir ---"
            head -35 include/basic_types.h
          else
            echo "UYARI: header guard bulunamadi, enjeksiyon atlandi"
          fi
          echo ""
          echo "--- 5GHz/VHT bandini kapatiyoruz (kernelde VHT struct/enum destegi yok, once 2.4GHz calissin) ---"
          # drv_conf.h icinde CONFIG_IEEE80211_BAND_5GHZ, CONFIG_RTL8812A/8821A/8814A
          # tanimliyken otomatik aciliyor. Bu blogu #if 0 yaparak kapatiyoruz,
          # boylece VHT-bagimli struct/enum kullanan tum kod (ioctl_cfg80211.c
          # icindeki rtw_cfg80211_create_vht_cap cagrisi dahil) derleme disi kalir.
          if grep -q "if defined(CONFIG_RTL8812A) || defined(CONFIG_RTL8821A) || defined(CONFIG_RTL8814A)" include/drv_conf.h; then
            sed -i 's/#if defined(CONFIG_RTL8812A) || defined(CONFIG_RTL8821A) || defined(CONFIG_RTL8814A)/#if 0 \/* 5GHz\/VHT gecici olarak kapali - kernelde VHT destegi yok *\//' include/drv_conf.h
            echo "5GHz/VHT blogu kapatildi, dogrulama:"
            grep -n "if 0.*5GHz" include/drv_conf.h
          else
            echo "UYARI: 5GHz blogu bulunamadi, atlandi"
          fi

      - name: Stub out VHT/cfg80211_chan_def dependent functions
        run: |
          if [ ! -d rtl8812au ]; then
            echo "rtl8812au klasoru yok, adim atlaniyor"
            exit 0
          fi
          cd rtl8812au
          cat > /tmp/fix_vht.py << 'PYEOF'
          import sys
          path = "os_dep/linux/ioctl_cfg80211.c"
          with open(path) as f:
              text = f.read()

          def replace_function(text, old_sig, new_body, label):
              idx = text.find(old_sig)
              if idx == -1:
                  print(f"UYARI: bulunamadi - {label}")
                  return text
              brace_start = text.find('{', idx)
              depth = 0
              i = brace_start
              while i < len(text):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          break
                  i += 1
              end_idx = i + 1
              print(f"OK: {label} degistirildi ({end_idx - idx} karakter)")
              return text[:idx] + new_body + text[end_idx:]

          text = replace_function(
              text,
              "static int\tcfg80211_rtw_set_monitor_channel(struct wiphy *wiphy, struct cfg80211_chan_def *chandef)",
              "static int\tcfg80211_rtw_set_monitor_channel(struct wiphy *wiphy, void *chandef)\n"
              "{\n"
              "\t/* 5GHz/VHT/chan_def gecici olarak devre disi - kernelde struct cfg80211_chan_def yok */\n"
              "\treturn 0;\n"
              "}\n",
              "cfg80211_rtw_set_monitor_channel"
          )

          text = replace_function(
              text,
              "static int cfg80211_rtw_get_channel(struct wiphy *wiphy, struct wireless_dev *wdev, struct cfg80211_chan_def *chandef){",
              "static struct ieee80211_channel * cfg80211_rtw_get_channel(struct wiphy *wiphy)\n"
              "{\n"
              "\t/* 5GHz/VHT/chan_def gecici olarak devre disi - kernelde struct cfg80211_chan_def yok */\n"
              "\treturn NULL;\n"
              "}\n",
              "cfg80211_rtw_get_channel"
          )

          text = replace_function(
              text,
              "static void rtw_cfg80211_create_vht_cap(_adapter *padapter, struct ieee80211_sta_vht_cap *vht_cap)",
              "static void rtw_cfg80211_create_vht_cap(_adapter *padapter, void *vht_cap)\n"
              "{\n"
              "\t/* VHT gecici olarak devre disi - kernelde struct ieee80211_sta_vht_cap yok */\n"
              "\treturn;\n"
              "}\n",
              "rtw_cfg80211_create_vht_cap"
          )

          old_decl = "\tstruct wiphy *wiphy = pwdev->wiphy;\n\tstruct ieee80211_sta_vht_cap *vht_cap;"
          new_decl = "\tstruct wiphy *wiphy = pwdev->wiphy;"
          if old_decl in text:
              text = text.replace(old_decl, new_decl)
              print("OK: kullanilmayan vht_cap yerel degiskeni kaldirildi")
          else:
              print("UYARI: vht_cap yerel degisken satiri bulunamadi (belki zaten yok)")

          with open(path, 'w') as f:
              f.write(text)

          print("Tum VHT/chan_def duzeltmeleri tamamlandi.")
          PYEOF
          python3 /tmp/fix_vht.py
          echo ""
          echo "--- Doğrulama: kalan korumasız VHT/chan_def referansları ---"
          grep -n "ieee80211_sta_vht_cap\|cfg80211_chan_def\|NL80211_CHAN_WIDTH\|IEEE80211_VHT_" os_dep/linux/ioctl_cfg80211.c

      - name: Inject radiotap constant fallbacks into rtw_radiotap.c
        run: |
          if [ ! -d rtl8812au ]; then
            echo "rtl8812au klasoru yok, adim atlaniyor"
            exit 0
          fi
          cd rtl8812au
          RADIOTAP_FILE="os_dep/linux/rtw_radiotap.c"
          if [ ! -f "$RADIOTAP_FILE" ]; then
            echo "UYARI: $RADIOTAP_FILE bulunamadi, atlandi"
            exit 0
          fi
          INCLUDE_LINE=$(grep -n "^#include <net/ieee80211_radiotap.h>" "$RADIOTAP_FILE" | head -1 | cut -d: -f1)
          echo "Include satiri: $INCLUDE_LINE"
          if [ -n "$INCLUDE_LINE" ]; then
            printf '%s\n' \
              '#ifndef IEEE80211_RADIOTAP_AMPDU_STATUS' \
              '#define IEEE80211_RADIOTAP_AMPDU_STATUS 20' \
              '#endif' \
              '#ifndef IEEE80211_RADIOTAP_VHT' \
              '#define IEEE80211_RADIOTAP_VHT 21' \
              '#endif' > /tmp/radiotap_c_fallback.h
            head -n "$INCLUDE_LINE" "$RADIOTAP_FILE" > /tmp/radiotap_c_new.c
            cat /tmp/radiotap_c_fallback.h >> /tmp/radiotap_c_new.c
            tail -n +$((INCLUDE_LINE + 1)) "$RADIOTAP_FILE" >> /tmp/radiotap_c_new.c
            mv /tmp/radiotap_c_new.c "$RADIOTAP_FILE"
            echo "--- Enjeksiyon sonrasi ilk 30 satir ---"
            head -30 "$RADIOTAP_FILE"
          else
            echo "UYARI: include satiri bulunamadi, enjeksiyon atlandi"
          fi

      - name: Attempt kernel module build
        run: |
          set +e
          if [ ! -d rtl8812au ]; then
            echo "rtl8812au klasoru yok, build atlaniyor" | tee build_log.txt
            exit 0
          fi
          cd rtl8812au
          echo "=== DEBUG: Makefile ilk 3 satiri (enjeksiyon kontrolu) ===" > ../build_log.txt
          head -3 Makefile >> ../build_log.txt
          echo "=== DEBUG SONU ===" >> ../build_log.txt
          echo "" >> ../build_log.txt
          echo "=== Derleme baslatiliyor ==="
          make ARCH=mips CROSS_COMPILE=mips-linux-gnu- KSRC="$GITHUB_WORKSPACE/$KDIR" 2>&1 | tee -a ../build_log.txt
          echo "=== Derleme sonucu ==="
          find . -name "*.ko" 2>/dev/null | tee ../ko_files.txt
          if [ -s ../ko_files.txt ]; then
            echo "BASARILI: .ko dosyasi olustu"
          else
            echo "BASARISIZ: .ko dosyasi olusmadi, build_log.txt'e bak"
          fi
          exit 0

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp build_log.txt output/ 2>/dev/null || true
          cp clone_log.txt output/ 2>/dev/null || true
          cp platform_options.txt output/ 2>/dev/null || true
          find rtl8812au -name "*.ko" -exec cp {} output/ \; 2>/dev/null || true
          # build_log son 200 satir - ozet
          tail -200 build_log.txt > output/build_log_tail200.txt 2>/dev/null || true
          ls -la output/

      - name: Cleanup large source before commit
        run: |
          rm -rf extracted rtl8812au GPL_W9970V3.tar.gz

      - name: Push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          rm -rf build_output
          mv output build_output
          git add build_output/
          git commit -m "RTL8812AU derleme denemesi" || echo "Degisiklik yok"
          git push
